name = "pacixp-api"
main = "index.js"
compatibility_date = "2026-05-07"

# No workers.dev or preview URLs: the forms post only to api.pacixp.net, and a
# second hostname would bypass zone-level protection (WAF, rate-limit rules).
workers_dev = false
preview_urls = false

[[routes]]
pattern = "api.pacixp.net"
custom_domain = true

# Per-IP cap on form POSTs (counted per Cloudflare location)
[[ratelimits]]
name = "FORM_LIMITER"
namespace_id = "7101"

  [ratelimits.simple]
  limit = 5
  period = 60

[observability]
enabled = true
